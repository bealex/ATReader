# SwiftLint configuration for ATReader.
#
# Shares one code style across the LonelyBytes projects
# (~/Programming/_Scripts/Instructions/CLAUDE.CodeStyle.md).
# Run via Scripts/lint.sh (which `cd`s to the repo root so the paths below resolve).
# Formatting that swift-format already enforces (indentation, line breaks, brace placement, trailing commas)
# is left to Scripts/format.sh; this file covers the lint-only concerns and a few rules that must agree with
# the formatter (indented switch cases, 120-column lines).

included:
  - Code
  - Frameworks/AuthorToday/Sources
  - Frameworks/AuthorToday/Tests

excluded:
  - "**/.build"           # any SwiftPM build dir (incl. the StyleRespace tool's checked-out swift-syntax)
  - .build
  - Resources             # bundled assets
  - Scripts/StyleRespace  # the formatter helper tool — its own package, vendored verbatim

disabled_rules:
  - todo                       # style permits TODO/FIXME notes where logic isn't obvious
  - force_try                  # style allows try! when failure is impossible by design
  - trailing_comma             # swift-format owns trailing commas (see the note below); don't fight it
  - type_body_length           # SwiftUI view bodies and the provider clients / feed engine are cohesive
                               #   single types that legitimately run long; file_length (below) still guards
                               #   overall file size. Splitting them only to satisfy a line count adds
                               #   indirection without improving the design.

opt_in_rules:
  - sorted_imports                      # imports sorted (case-insensitive). Owns import order: swift-format's
                                        # OrderedImports is OFF in .swift-format because the two sort opposite
                                        # ways for mixed-case module names (swift-format is ASCII/uppercase-
                                        # first, swiftlint case-insensitive), which made them fight on every
                                        # file importing both. Keep it here only.
  - closure_spacing                     # `{ $0 }` with interior spaces
  - vertical_whitespace_opening_braces  # no blank line after an opening brace
  - vertical_whitespace_closing_braces  # no blank line before a closing brace
  - multiline_parameters                # broken parameter lists: one per line (no partial breaks)
  - multiline_arguments                 # broken argument lists: one per line (no partial breaks)

# Namespace enums (`enum FreeFeed { struct PostDTO { enum CodingKeys } }`) are the project convention,
# which inherently nests a type two levels deep. Allow that.
nesting:
  type_level: 2

# ── Rules that must agree with swift-format ────────────────────────────────────
switch_case_alignment:
  indented_cases: true          # `case` indented one level inside the `switch` body

# trailing_comma is disabled (see disabled_rules): swift-format owns comma placement via
# `multiElementCollectionTrailingCommas: true` — it adds a trailing comma to *multi-element* multiline
# collections but strips it from *single-element* ones. SwiftLint's trailing_comma can only require commas on
# *every* multiline collection (mandatory_comma: true) or forbid them on all (false); neither mirrors
# swift-format's per-arity behaviour, so a single-element multiline literal made the two tools fight. Letting
# the formatter own it (as with opening_brace below) keeps them in agreement.

opening_brace:
  # swift-format owns brace placement and puts `{` on its own line after a wrapped multi-line condition /
  # signature / type header. Don't fight that; still enforce the brace for the normal single-line case.
  ignore_multiline_statement_conditions: true
  ignore_multiline_function_signatures: true
  ignore_multiline_type_headers: true

# ── Metrics ───────────────────────────────────────────────────────────────────
line_length:
  warning: 120
  error: 200                    # hard ceiling; the style allows >120 only for strings/generated/tests
  ignores_urls: true
  ignores_comments: true
  ignores_interpolated_strings: true
  ignores_function_declarations: false

file_length:
  warning: 1000                 # style: a file approaching 1000 lines should be split
  error: 1500
  ignore_comment_only_lines: true

# ── Naming ────────────────────────────────────────────────────────────────────
# No 1-3 letter identifiers (let/var, parameters, enum cases) — spell them out. The `excluded` list is the
# curated set of allowed short names (loop indices, coordinates/deltas, operator operands, well-known terms).
# Faithful transcriptions from Nuked-OPL3 / AdPlug carry many short reference names (`op`, `eg`, `pg`, …);
# suppress those inline with an explanatory comment (`// swiftlint:disable:next identifier_name`) that cites
# the reference, rather than loosening this rule. Function names are covered by the `short_function_name`
# custom rule below; type names by `type_name`.
identifier_name:
  min_length:
    warning: 4                  # 1-3 letter names are flagged
  max_length:
    warning: 60
    error: 80
  allowed_symbols: ["_"]
  excluded:
    - i                         # loop index
    - j
    - k
    - n                         # count / math
    - x                         # coordinates
    - y
    - z
    - dx                        # coordinate deltas
    - dy
    - dz
    - lhs                       # operator / Comparable operands
    - rhs
    - id                        # well-known terms (see code style)
    - ids                       # a set/array of ids
    - url
    - key                       # a dictionary / info-dictionary key
    - now                       # the current instant (a `now: Date = Date()` seam for testable time)
    - at                        # a timestamp column / field (server side)
    - ip                        # an IP address (rate-limit key)
    - env                       # an environment name (APNs sandbox/production)
    - ttl                       # a cache time-to-live
    - min                       # a lower bound (reconnect backoff, tiers)
    - max                       # an upper bound
    - cut                       # the incremental "newer-than-loaded" cut date (see FeedBlockAssembler)
    - raw                       # raw value before wrapping (`let raw = word & 0xFF`)
    - row                       # a database/table row (SwiftData fetch result)
    - own                       # the viewer↔feed relation case (FeedSubscriptionRelation.own)
    - fio                       # author.today's own field name for a display name (JSON key)
    - any                       # the service's "any form"/"any format" enum member
    - get                       # the HTTP method
    - api                       # the service-error case (AuthorTodayError.api)

type_name:
  min_length:
    warning: 4                  # 1-3 letter type names are flagged
  max_length:
    warning: 50
    error: 60
  excluded:
    - ID                        # well-known acronyms
    - API
    - T                         # conventional generic placeholders
    - U
    - V

# ── Custom rules (regex) for style points the built-in rules don't cover ───────
# These encode project-specific conventions that neither SwiftLint's built-ins nor swift-format enforce.
custom_rules:
  guard_break_keep_guard_alone:
    name: "Guard layout"
    # A guard that breaks across lines (the guard line ends in `,`, `{`, `&&` or `||`) must instead put
    # `guard` alone on its line with the expression indented below. Single-line guards end in `}`.
    regex: '^[ \t]*guard[ \t]+\S[^\n]*([,{]|&&|\|\|)[ \t]*$'
    message: "A guard that breaks to multiple lines must stand alone: put `guard` on its own line and the expression(s) on the indented line(s) below."
    severity: warning
  collection_literal_open_space:
    name: "Collection literal spacing"
    # Interior space after `[` in a literal that starts with `.`, `"`, or a digit (excludes array types
    # like `[Int]` and subscripts like `arr[0]`, which start with an identifier or follow one).
    regex: '(?<![\w)\]?!])\[(?=[."0-9])'
    excluded_match_kinds: [comment, doccomment, string]
    message: "Collection literals use interior spaces: write `[ .foo ]`, not `[.foo]`."
    severity: warning
  collection_literal_close_space:
    name: "Collection literal spacing"
    # Interior space before `]` on a single-line literal (same literal-vs-type/subscript guard as above).
    regex: '(?<![\w)\]?!])\[ ?[."0-9][^\]\n]*\S\]'
    excluded_match_kinds: [comment, doccomment, string]
    message: "Collection literals use interior spaces: write `[ .foo ]`, not `[.foo]`."
    severity: warning
  short_function_name:
    name: "Short function name"
    # `identifier_name` doesn't cover function declarations; flag 1-3 letter func names. Operators (which
    # start with a symbol, not a letter) are not matched.
    regex: 'func\s+[a-zA-Z_][a-zA-Z0-9_]{0,2}\s*[(<]'
    excluded_match_kinds: [comment, doccomment, string]
    message: "Function names must be descriptive (4+ characters); avoid 1-3 letter abbreviations."
    severity: warning

reporter: "xcode"
